
name: Build Lightweight Debian 13 for UFI103S

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian13-ufi103s-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-none-eabi \
            debootstrap qemu-user-static \
            binfmt-support \
            android-sdk-libsparse-utils \
            autoconf automake cmake libtool pkg-config \
            fdisk e2fsprogs kmod cpio \
            python3 python3-cryptography \
            python3-pyasn1-modules python3-pycryptodome \
            rsync xz-utils zstd

      - name: Clone UFI103S image builder
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules \
            https://github.com/hmhmdcy/OpenStick-Builder-UFI001C.git \
            builder
          cd builder
          git submodule update --init --recursive

      - name: Clone Linux kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 \
            --branch msm8916/6.12.1 \
            https://github.com/a520ass/linux-ufi.git \
            linux

      - name: Compile custom ARM64 kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd linux

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            msm8916_defconfig

          # Disable Bluetooth but preserve Qualcomm Wi-Fi.
          scripts/config --disable BT
          scripts/config --disable BT_BREDR
          scripts/config --disable BT_LE
          scripts/config --module WCN36XX
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211

          # USB device mode and configfs gadget support.
          scripts/config --enable USB
          scripts/config --enable USB_GADGET
          scripts/config --enable USB_CONFIGFS
          scripts/config --enable USB_CONFIGFS_RNDIS
          scripts/config --enable USB_CHIPIDEA
          scripts/config --enable USB_CHIPIDEA_UDC

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          make -j2 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image modules dtbs

          test -s arch/arm64/boot/Image
          test -s arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb

          echo "KERNELRELEASE=$(make -s ARCH=arm64 kernelrelease)" \
            >> "$GITHUB_ENV"

      - name: Prepare UFI103S device tree and bootloader
        shell: bash
        run: |
          set -euxo pipefail
          cd builder

          # Use the UFI-family board identifier in lk2nd.
          sed -i \
            's/yiming,uz801-v3/thwc,ufi001c/g' \
            scripts/build_hyp_aboot.sh

          # Use the DTB compiled from our own kernel source.
          mkdir -p dtbs
          install -m 0644 \
            "$GITHUB_WORKSPACE/linux/arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb" \
            dtbs/msm8916-thwc-ufi001c.dtb

          # Do not blindly disable the MPSS device-tree node:
          # Qualcomm remoteproc/firmware dependencies must be verified
          # before making that hardware-level change.

      - name: Fix Qualcomm firmware download and verify checksum
        shell: bash
        run: |
          set -euxo pipefail
          cd builder

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/extract_fw.sh")
          s = p.read_text()

          start = s.find("# extract Qualcom firmware")
          end = s.find("cleanup() {", start)

          if start < 0 or end < 0:
              raise SystemExit(
                  "Cannot locate firmware download section in extract_fw.sh"
              )

          replacement = r'''# Download and verify Qualcomm firmware
          SRC="https://archive.org/download/dragonboard-410c-bootloader-emmc-linux-176/dragonboard-410c-bootloader-emmc-linux-176.zip"
          SHA256="a37c4e82a970ae2350fcfc7180559caf1dc3928e7c169316fe4ab899b7d305ad"
          FNAME="dragonboard-410c-bootloader-emmc-linux-176.zip"

          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
              "$SRC" -o "${TMPDIR}/${FNAME}"

          echo "${SHA256}  ${TMPDIR}/${FNAME}" | sha256sum -c -

          unzip -o -j -d files/ "${TMPDIR}/${FNAME}" \
              "${FNAME%.*}/rpm.mbn" \
              "${FNAME%.*}/sbl1.mbn" \
              "${FNAME%.*}/tz.mbn"

          for f in rpm.mbn sbl1.mbn tz.mbn; do
              test -s "files/$f" || {
                  echo "Missing Qualcomm firmware: files/$f"
                  exit 1
              }
          done

          '''

          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Build bootloader and extract firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd builder
          sudo bash scripts/install_deps.sh
          sudo bash scripts/build_hyp_aboot.sh
          sudo bash scripts/extract_fw.sh

          for f in aboot.mbn hyp.mbn rpm.mbn sbl1.mbn tz.mbn; do
            test -s "files/$f"
          done

      - name: Build minimal Debian 13 root filesystem
        shell: bash
        run: |
          set -euxo pipefail
          cd builder

          # Remove the default empty-root-password setting from the
          # generated system later, after debootstrap has completed.
          sudo env RELEASE=trixie \
            CHROOT="$GITHUB_WORKSPACE/builder/rootfs" \
            bash scripts/debootstrap.sh

          test -d rootfs
          test -f rootfs/etc/os-release

      - name: Install custom kernel and configure the system
        shell: bash
        env:
          ROOT_PASSWORD: 2289256127
        run: |
          set -euxo pipefail

          BUILDER="$GITHUB_WORKSPACE/builder"
          KERNEL="$GITHUB_WORKSPACE/linux"
          ROOTFS="$BUILDER/rootfs"
          KREL="$KERNELRELEASE"

          test -s "$KERNEL/arch/arm64/boot/Image"
          test -s "$KERNEL/arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb"

          # Install the kernel modules built from source.
          sudo make -C "$KERNEL" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$ROOTFS" \
            modules_install

          # Keep only the modules matching our compiled kernel.
          sudo find "$ROOTFS/lib/modules" \
            -mindepth 1 -maxdepth 1 -type d \
            ! -name "$KREL" -exec rm -rf {} +

          sudo depmod -b "$ROOTFS" "$KREL"

          # extlinux.conf expects /vmlinuz on the boot partition.
          sudo install -D -m 0644 \
            "$KERNEL/arch/arm64/boot/Image" \
            "$ROOTFS/boot/vmlinuz"

          sudo install -D -m 0644 \
            "$KERNEL/arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb" \
            "$ROOTFS/boot/dtbs/qcom/msm8916-thwc-ufi001c.dtb"

          # Configure root password without printing it.
          printf 'root:%s\n' "$ROOT_PASSWORD" |
            sudo chroot "$ROOTFS" chpasswd

          # Disable Bluetooth and modem-management software.
          # Keep Qualcomm firmware/transport components needed by Wi-Fi.
          sudo chroot "$ROOTFS" /bin/bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get purge -y bluez bluez-tools blueman modemmanager || true
            apt-get autoremove -y || true
            apt-get clean
            systemctl disable ModemManager.service 2>/dev/null || true
            systemctl disable bluetooth.service 2>/dev/null || true
            systemctl enable ssh.service 2>/dev/null || true
            systemctl enable NetworkManager.service 2>/dev/null || true
          '

          # Allow SSH password login for root on the private device.
          sudo install -d "$ROOTFS/etc/ssh/sshd_config.d"
          sudo tee "$ROOTFS/etc/ssh/sshd_config.d/99-ufi103s.conf" >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          EOF

          # Adjust the existing NetworkManager profiles when their
          # original defaults are present.
          if [ -d "$ROOTFS/etc/NetworkManager/system-connections" ]; then
            sudo find "$ROOTFS/etc/NetworkManager/system-connections" \
              -type f -name '*.nmconnection' \
              -exec sed -i \
                -e 's/Openstick/UFI103S/g' \
                -e 's/openstick/12345678/g' \
                -e 's/192\.168\.5\.1/192.168.100.1/g' {} +
            sudo chmod 600 \
              "$ROOTFS"/etc/NetworkManager/system-connections/*.nmconnection \
              2>/dev/null || true
          fi

          # Automatically expand ext4 on the existing rootfs partition.
          sudo tee "$ROOTFS/etc/systemd/system/ufi103s-resize-rootfs.service" >/dev/null <<'EOF'
          [Unit]
          Description=Expand UFI103S root filesystem
          After=local-fs.target
          ConditionPathExists=/dev/disk/by-partlabel/rootfs

          [Service]
          Type=oneshot
          ExecStart=/sbin/resize2fs /dev/disk/by-partlabel/rootfs
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl --root="$ROOTFS" enable \
            ufi103s-resize-rootfs.service

          # Ensure Wi-Fi firmware files supplied by the base builder
          # remain present; do not remove /lib/firmware or WCNSS files.
          sudo test -d "$ROOTFS/lib/firmware"

      - name: Build gadget tools
        shell: bash
        run: |
          set -euxo pipefail
          cd builder
          sudo bash scripts/build_gt.sh

      - name: Repack root filesystem and create flash images
        shell: bash
        run: |
          set -euxo pipefail
          cd builder

          # Repack after custom kernel and configuration changes.
          sudo tar cpzf rootfs.tgz \
            --exclude="./usr/bin/qemu-aarch64-static" \
            -C rootfs .

          sudo bash scripts/build_images.sh

          for f in boot.bin rootfs.bin; do
            test -s "files/$f"
          done

          # Do not publish the generated GPT as a ready-to-flash image.
          # Its partition layout must not overwrite the existing device GPT
          # until the actual eMMC partition geometry has been verified.
          rm -f files/gpt_both0.bin

          cat > files/FLASH-INSTRUCTIONS.txt <<'EOF'
          UFI103S - Debian 13 ARM64

          Build target:
          - UFI103S / Qualcomm MSM8916
          - Debian 13 Trixie, ARM64
          - Kernel compiled from source
          - Bluetooth software removed
          - SSH enabled
          - Root password: 2289256127
          - Intended USB RNDIS address: 192.168.100.1

          IMPORTANT:
          This artifact deliberately does not include gpt_both0.bin.
          Do not flash a GPT generated by another board or an unverified
          partition layout. This build assumes the existing device already
          has the expected boot and rootfs partitions.

          Before flashing, verify the actual partition table and that the
          bootloader supports this boot image and device tree. Back up the
          unique device partitions (fsc, fsg, modem, modemst1, modemst2,
          persist and sec) before any operation that could overwrite them.

          The rootfs image is smaller than the eMMC. On first boot, the
          resize service attempts to expand ext4 to the existing rootfs
          partition size.

          Wi-Fi AP settings depend on the builder's NetworkManager profile
          format. Confirm the generated profile and actual interface after
          first boot.
          EOF

          echo "Final artifact files:"
          ls -lh files/

      - name: Upload flash images
        uses: actions/upload-artifact@v4
        with:
          name: Debian13-UFI103S-ARM64-source-kernel
          if-no-files-found: error
          path: |
            builder/files/aboot.mbn
            builder/files/hyp.mbn
            builder/files/rpm.mbn
            builder/files/sbl1.mbn
            builder/files/tz.mbn
            builder/files/boot.bin
            builder/files/rootfs.bin
            builder/files/FLASH-INSTRUCTIONS.txt
