
name: UFI103S Debian 13 Source Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev dwarves \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            debootstrap qemu-user-static \
            binfmt-support cpio rsync \
            kmod e2fsprogs \
            android-sdk-libsparse-utils \
            python3 python3-pip

      - name: Clone UFI103S image builder
        run: |
          git clone --recurse-submodules \
            https://github.com/hmhmdcy/OpenStick-Builder-UFI001C.git \
            builder

      - name: Install image builder dependencies
        run: |
          cd builder
          sudo bash scripts/install_deps.sh

      - name: Clone Linux source
        run: |
          git clone --depth=1 \
            --branch msm8916/6.12.1 \
            https://github.com/a520ass/linux-ufi.git \
            linux

      - name: Configure UFI103S device tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "linux/arch/arm64/boot/dts/qcom/"
              "msm8916-thwc-ufi001c.dts"
          )
          if not p.is_file():
              raise SystemExit(f"UFI103S DTS not found: {p}")

          s = p.read_text()
          if not re.search(r"&mpss\s*\{", s):
              raise SystemExit("MPSS node not found; refusing blind patch")

          # Disable the modem processor node.
          s, n = re.subn(
              r"(&mpss\s*\{)",
              r'\1\n\tstatus = "disabled";',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("Failed to patch MPSS node")

          p.write_text(s)
          PY

      - name: Build Linux kernel, modules and DTB
        shell: bash
        run: |
          set -euxo pipefail

          SRC="$GITHUB_WORKSPACE/linux"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          CROSS=aarch64-linux-gnu-

          make -C "$SRC" O="$OUT" \
            ARCH=arm64 CROSS_COMPILE="$CROSS" defconfig

          for option in \
            ARCH_QCOM SERIAL_MSM SERIAL_MSM_CONSOLE \
            MMC MMC_BLOCK MMC_SDHCI MMC_SDHCI_MSM \
            EXT4_FS DEVTMPFS DEVTMPFS_MOUNT \
            BLK_DEV_INITRD MODULES FW_LOADER \
            USB_GADGET USB_CONFIGFS USB_CONFIGFS_RNDIS \
            USB_CHIPIDEA USB_CHIPIDEA_UDC \
            CFG80211 MAC80211 WCN36XX
          do
            "$SRC/scripts/config" \
              --file "$OUT/.config" --enable "$option"
          done

          make -C "$SRC" O="$OUT" \
            ARCH=arm64 CROSS_COMPILE="$CROSS" olddefconfig

          make -C "$SRC" O="$OUT" \
            ARCH=arm64 CROSS_COMPILE="$CROSS" \
            -j2 Image modules dtbs

          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb"

          cp \
            "$OUT/arch/arm64/boot/dts/qcom/msm8916-thwc-ufi001c.dtb" \
            builder/dtbs/

      - name: Configure rootfs and replace prebuilt kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Root password and SSH configuration.
          p = Path("builder/scripts/setup.sh")
          s = p.read_text()

          s = s.replace(
              "passwd -d root",
              "echo 'root:2289256127' | chpasswd"
          )

          ssh = """
          mkdir -p /etc/ssh/sshd_config.d
          cat > /etc/ssh/sshd_config.d/10-ufi103s.conf <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          EOF
          """

          if "10-ufi103s.conf" not in s:
              s += "\n" + ssh + "\n"

          # Remove modem-management userspace packages.
          lines = []
          for line in s.splitlines():
              pkg = line.strip().rstrip("\\").strip()
              if pkg in {"modemmanager", "qrtr-tools", "rmtfs"}:
                  continue
              lines.append(line)
          p.write_text("\n".join(lines) + "\n")

          # Customize the network profiles.
          root = Path("builder/configs")
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              try:
                  text = p.read_text()
              except (UnicodeDecodeError, OSError):
                  continue

              text = text.replace("192.168.4.", "192.168.50.")
              text = text.replace("192.168.5.", "192.168.100.")
              text = text.replace("Openstick", "UFI103S")
              text = text.replace("openstick", "UFI103S")
              text = re.sub(
                  r"(?m)^(\s*psk\s*=\s*).*$",
                  r"\g<1>12345678",
                  text
              )
              p.write_text(text)

          # Replace the builder's precompiled kernel download with
          # the kernel compiled by this workflow.
          p = Path("builder/scripts/debootstrap.sh")
          s = p.read_text()

          start = s.find("# install kernel")
          end = s.find(
              "mkdir -p ${CHROOT}/boot/extlinux",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "Could not locate kernel install section; stopping"
              )

          replacement = r'''
          # Install the kernel compiled from source.
          KERNEL_SRC="$(pwd)/../linux"
          KERNEL_OUT="$(pwd)/../kernel-out"

          install -D -m 0644 \
            "${KERNEL_OUT}/arch/arm64/boot/Image" \
            "${CHROOT}/boot/vmlinuz"

          make -C "${KERNEL_SRC}" O="${KERNEL_OUT}" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="${CHROOT}" modules_install

          '''

          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Build complete Debian firmware
        run: |
          cd builder
          sudo bash ./build_for_ufi001c.sh

      - name: Verify firmware artifacts
        run: |
          set -euxo pipefail
          cd builder/files

          for f in \
            gpt_both0.bin hyp.mbn rpm.mbn sbl1.mbn \
            tz.mbn aboot.mbn boot.bin rootfs.bin
          do
            test -s "$f"
          done

          sha256sum *.bin > SHA256SUMS.txt
          ls -lh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UFI103S-Debian13-Source-Firmware
          path: builder/files/*
          if-no-files-found: error
          retention-days: 14
